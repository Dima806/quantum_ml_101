[project]
name = "quantum-ml-101"
version = "0.1.0"
description = "Quantum Machine Learning 101: it's a matrix multiply on a laptop, and your logistic regression still wins"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pennylane>=0.38",
    "pennylane-lightning>=0.38",
    "numpy>=1.26",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "streamlit>=1.38",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
qiskit = [
    "qiskit>=1.2",            # equally keyless local alternative
    "qiskit-aer>=0.15",
    "qiskit-machine-learning>=0.8",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "ty>=0.0.1a7",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbclient>=0.10",
]

# Notebooks and the Streamlit app import the library as `from src...` and run from the repo
# root, so the project is a virtual (non-installed) uv project: `uv sync` resolves and installs
# the dependencies above without needing a build backend for the project itself.
[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "A", "SIM", "PTH"]
# E501: line length handled by the formatter.
# N802/N803/N806: allow math/ML naming (X for a data matrix, C for the SVM
# penalty, unitaries like U) that the pep8-naming rules would otherwise reject.
ignore = ["E501", "N802", "N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]
